<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUDO LIST </title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />


    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script> 
</head>
<body>

    <main class = "container"> 
        <header class = "header">
          <div>
            <h1>Minhas tarefas</h1>
            <p>Organise seu dia e suas atividades</p>
             
           </div>
           <span class="material-symbols-outlined">
checklist
</span>
            
           </span>

        </header>

        <div class ="form-tarefa"> 
            <input type="text" id="input-tarefa" placeholder="O que tu vai fazer man ??" onkeydown="if (event.key === 'Enter') adicionarTarefa"/>

            <button type="button" oncklick="adicionarTarefa()">
                Adicionar
                <span class="material-symbols-outlined">
add
</span> 
            </button>
        </div>
        <nav class ="filtros">
            <button>Todas</button>
            <button>Pendentes</button>
            <button>Colunas</button>
            
        </nav>

           <ul id="lista-tarefas" class = "lista-tarefas">
                
           </ul>


    </main>

</body>
</html>
